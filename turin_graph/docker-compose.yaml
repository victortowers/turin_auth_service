services:
  traffic-test:
    image: turin-container:latest
    container_name: turin_test
    restart: unless-stopped
    environment:
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?FIREBASE_WEB_API_KEY is required}
      SERVICE_CREDENTIALS: ${SERVICE_CREDENTIALS:?SERVICE_CREDENTIALS is required}

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/openapi.json')"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 0s
