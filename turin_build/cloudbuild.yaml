steps:
  # 1. Install dependencies + test
  - name: 'ghcr.io/astral-sh/uv:python3.13-bookworm-slim'
    id: 'test'
    dir: /workspace/turin_build
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace/traffic-build

        uv sync
        uv run ruff check .
        uv run mypy .
        uv run python -m py_compile osm14.py

  # 2. Download Geofabrik
  - name: 'gcr.io/cloud-builders/curl'
    id: 'download-geofabrik'
    args:
      - '-L'
      - '--fail'
      - '--retry'
      - '5'
      - '-o'
      - '/workspace/turin_build/sudeste.osm.pbf'
      - 'https://download.geofabrik.de/south-america/brazil/sudeste-latest.osm.pbf'

  # 3. Extract
  - name: 'ghcr.io/osmcode/osmium-tool'
    id: 'osmium'
    entrypoint: 'osmium'
    args:
      - extract
      - '--polygon'
      - 'shape.geojson'
      - '--output'
      - '/workspace/turin_build/sudeste-extract.osm.pbf'
      - '/workspace/turin_build/sudeste-latest.osm.pbf'

  # 4. Run Python processor
  - name: 'ghcr.io/astral-sh/uv:python3.13-bookworm-slim'
    id: 'generate-data'
    dir: /workspace/turin_build/
    entrypoint: 'bash'
    args:
        - '-c'
        - |
          set -e

          uv sync

          uv run python osm14.py \
            --with-coords \
            sudeste-extract.osm.pbf

options:
  logging: CLOUD_LOGGING_ONLY
