
name: Import OSM into Neon

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DB }}

    steps:
      - name: Install osm2pgsql and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y osm2pgsql postgresql-client osmium-tool
          curl -fsSL https://awscli.amazonaws.com/v2/install.sh | bash

      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"

          osm2pgsql --version
          psql "$NEON_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT PostGIS_Full_Version();"

      - name: Download OSM extract
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          aws s3 cp s3://turin-graph1/sudeste2.osm.pbf ./sudeste2.osm.pbf --endpoint-url "https://a5682a7c9f2732888eedbc7c0071c76c.eu.r2.cloudflarestorage.com"

          test -s ./sudeste2.osm.pbf
          ls -lh ./sudeste2.osm.pbf

      - name: Import into Neon
        shell: bash
        run: |
          set -euox pipefail
          osmium fileinfo --extended sudeste2.osm.pbf

          osmium tags-filter sudeste2.osm.pbf \
            --verbose \
            nwr/place \
            nwr/boundary=administrative \
            nwr/addr:* \
            nwr/amenity \
            nwr/office \
            nwr/shop \
            nwr/tourism \
            nwr/leisure \
            -o /workspace/turin_build/sudeste3.osm.pbf

          osmium fileinfo --extended sudeste3.osm.pbf

          osm2pgsql \
            --create \
            --slim \
            --drop \
            --output=pgsql \
            --latlong \
            --number-processes 2 \
            --cache 2000 \
            --database "$NEON_DATABASE_URL" \
            ./sudeste3.osm.pbf

      - name: Verify import
        shell: bash
        run: |
          set -euo pipefail

          psql "$NEON_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) AS road_count
                FROM planet_osm_line
                WHERE highway IS NOT NULL;"

          psql "$NEON_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT name, highway
                FROM planet_osm_line
                WHERE highway IS NOT NULL
                LIMIT 10;"
