name: Test Docker Container for errors

on:
  push:
    branches:
      - dev
      - staging

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./turin_graph

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Download Application Data
        working-directory: ./turin_graph
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

        run: mkdir -p .osm_cache && aws s3 sync "s3://${{ secrets.R2_BUCKET}}" .osm_cache --endpoint-url "${{ secrets.R2_ENDPOINT }}" && dir -a

      - name: Build container
        working-directory: ./turin_graph
        run: docker build -t turin-container:latest .

      - name: Start services
        working-directory: ./turin_graph
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SERVICE_CREDENTIALS: ${{ secrets.SERVICE_CREDENTIALS }}
        run: docker compose up -d

      - name: Debug container
        run: |
          docker compose ps
          docker compose logs --no-color traffic-test
          sleep 5
          docker compose ps
          docker compose logs --no-color traffic-test

      - name: Wait for API
        run: |
          timeout 10 bash -c \
            'until curl -fsS http://localhost:8080/openapi.json > /dev/null; do sleep 1; done'

      - uses: schemathesis/action@v3
        env:
          SCHEMATHESIS_COVERAGE_FORMAT: "html,markdown"
          SCHEMATHESIS_COVERAGE_REPORT_HTML_PATH: "schema-coverage.html"
        with:
          schema: 'http://localhost:8080/openapi.json'
          authorization: 'Bearer ${{ secrets.API_TOKEN }}'
          args: '--report json --mode all --max-examples 500'


      - name: Wait for API
        shell: bash
        run: |
          timeout 60 bash -c \
            'until curl -fsS http://localhost:8080/openapi.json > /dev/null; do sleep 1; done'

      - name: Authenticate Firebase CI user
        shell: bash
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SERVICE_CREDENTIALS: ${{ secrets.SERVICE_CREDENTIALS }}
          FIREBASE_TEST_EMAIL: demodemo@example.com
          FIREBASE_TEST_PASSWORD: demodemo
          GOOGLE_CLOUD_PROJECT: identity-demo
        run: |
          set -euo pipefail

          LOGIN_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_WEB_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg email "$FIREBASE_TEST_EMAIL" \
              --arg password "$FIREBASE_TEST_PASSWORD" \
              '{email:$email,password:$password,returnSecureToken:true}')")

          ID_TOKEN=$(jq -er '.idToken' <<< "$LOGIN_RESPONSE")

          echo "::add-mask::$ID_TOKEN"

          # Exchange Firebase ID token for the server's session cookie.
          HEADERS=$(mktemp)
          BODY=$(mktemp)
          trap 'rm -f "$HEADERS" "$BODY"' EXIT

          curl --fail-with-body -sS \
            -D "$HEADERS" \
            -o "$BODY" \
            -X POST http://localhost:8080/sessionLogin \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg idToken "$ID_TOKEN" '{idToken:$idToken}')"

          SESSION_COOKIE=$(grep -i '^set-cookie: __Secure-turin_session=' "$HEADERS" \
            | head -n 1 \
            | sed -E 's/^[^:]+:[[:space:]]*([^;]+).*/\1/' \
            | tr -d '\r' || true)

          if [[ -z "$SESSION_COOKIE" ]]; then
            echo "ERROR: Session cookie was not returned."
            cat "$BODY"
            exit 1
          fi

          echo "::add-mask::$SESSION_COOKIE"

          # Make the cookie available to subsequent workflow steps.
          echo "SESSION_COOKIE=$SESSION_COOKIE" >> "$GITHUB_ENV"

          echo "Firebase session exchange succeeded."

      - name: Verify authenticated API access
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -sS \
            -o /tmp/auth-test-response.json \
            -w '%{http_code}' \
            -X POST http://localhost:8080/routing \
            -H "Content-Type: application/json" \
            -H "Cookie: ${SESSION_COOKIE}" \
            -d '{"node_start":1001568698,"node_end":1871768924}')

          if [[ "$STATUS" != "200" ]]; then
            echo "Authenticated routing request failed: HTTP $STATUS"
            cat /tmp/auth-test-response.json
            exit 1
          fi

          echo "PASS: Session cookie accepted by /routing."

      - name: Schemathesis API tests
        shell: bash
        env:
          SCHEMATHESIS_COVERAGE_FORMAT: "html,markdown"
          SCHEMATHESIS_COVERAGE_REPORT_HTML_PATH: "schema-coverage.html"
        run: |
          set -euo pipefail

          uvx schemathesis run \
            http://localhost:8000/openapi.json \
            --header "Cookie: ${SESSION_COOKIE}" \
            --report json \
            --mode all \
            --max-examples 500

      - name: Routing Testing - Speed Targets
        shell: bash
        run: |
          set -euo pipefail

          test_route() {
            local start="$1"
            local end="$2"
            local baseline="$3"

            echo ""
            echo "========================================"
            echo "Testing $start -> $end"
            echo "Baseline: ${baseline}s"
            echo "========================================"

            local response
            response=$(mktemp)

            curl --fail-with-body \
              -sS \
              -o "$response" \
              -w "HTTP status: %{http_code}\nRequest time: %{time_total}s\n" \
              -X POST \
              http://localhost:8000/routing \
              -H "Content-Type: application/json" \
              -H "Cookie: ${SESSION_COOKIE}" \
              -d "{\"node_start\": $start, \"node_end\": $end}"

            jq '{
              total_distance,
              estimated_time_seconds,
              estimated_time_hours,
              time_spent
            }' "$response"

            rm "$response"
          }

          test_route 1001568698 1871768924 0.300
          test_route 1001568698 245374595 0.425
          test_route 7040000553 245374595 1.000
          test_route 1656860075 1685204217 2.000
          test_route 1370531022 60685624 0.200
          test_route 7805862127 12480848899 0.080
          test_route 2922839021 2996077312 0.350
          test_route 2908684794 1813227883 0.225


      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schemathesis-results
          path: schemathesis-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down
