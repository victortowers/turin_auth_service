
name: Build and Update PMTiles

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pmtiles-sp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BBOX: "-47.684548,-24.348838,-42.775516,-22.197947"
      MAXZOOM: "15"
      MINZOOM: "4"

      PROFILE_DIR: "turin-profile"
      PROFILE_MAIN_CLASS: "br.turin.tiles.TurinProfile"

      PBF_URL: "https://r2.turinflow.com.br/sudeste2.osm.pbf"

      R2_ENDPOINT: "https://a5682a7c9f2732888eedbc7c0071c76c.eu.r2.cloudflarestorage.com"
      R2_BUCKET: "maps"
      R2_OBJECT: "sp.pmtiles"

    steps:
      # 1. Checkout

      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java and Maven

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y maven awscli curl jq

          java --version
          mvn --version

      # 3. Download OSM data

      - name: Download OSM PBF
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -Eeuo pipefail

          mkdir -p data

          aws s3 cp s3://turin-graph1/sudeste2.osm.pbf data/sp.osm.pbf --endpoint-url "https://a5682a7c9f2732888eedbc7c0071c76c.eu.r2.cloudflarestorage.com"

          test -s data/sp.osm.pbf

          ls -lh data/sp.osm.pbf

      # 4. Compile custom profile

      # 4. Generate vector tiles using Planetiler

      - name: Generate tiles
        run: |
          set -Eeuo pipefail

          mkdir -p data

          curl -fL \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar \
            -o planetiler.jar

          java -Xmx8g -jar planetiler.jar generate-custom \
           --schema=turin.yaml \
           --output=data/sp2.pmtiles \
           --maxzoom="$MAXZOOM" --force

          test -s data/sp2.pmtiles

      # 6. Install PMTiles CLI

      - name: Install PMTiles
        run: |
          set -Eeuo pipefail

          URL=$(curl -fsSL \
            https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | jq -er '[.assets[]
              | select(.name | test("Linux_x86_64.*\\.tar\\.gz$"))]
              | first
              | .browser_download_url')

          curl -fL "$URL" -o pmtiles.tar.gz

          tar -xzf pmtiles.tar.gz pmtiles

          sudo install pmtiles /usr/local/bin/pmtiles

      # 7. Validate archive


      # 8. Deploy to Cloudflare R2

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -Eeuo pipefail

          aws s3 cp \
            data/sp2.pmtiles \
            "s3://$R2_BUCKET/$R2_OBJECT" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.pmtiles" \
            --only-show-errors
