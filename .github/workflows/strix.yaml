name: Strix Pentesting

on:
  push:
    branches:
      - dev
      - staging
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Strix
        run: curl -sSL https://raw.githubusercontent.com/usestrix/strix/refs/heads/main/scripts/install.sh | bash

      - name: Run Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_OPENROUTER_STICKY_SESSIONS: true
        run: |

          strix -n -t ./turin_graph --scan-mode quick --max-budget 0.0125
          strix -n -t ./turin_auth --scan-mode quick --max-budget 0.0125
