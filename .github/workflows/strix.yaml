name: Strix Pentesting

on:
  push:
    branches:
      - dev
      - staging
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Docker Pull
        working-directory: ./turin_graph
        run: docker pull ghcr.io/victortowers/turin_auth_service:31b052a84980aca54d0e221250f0f76539830f46 && docker compose up -d & sleep 10 & docker ps
