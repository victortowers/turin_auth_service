
name: Build and Update PMTiles (Tilemaker)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pmtiles-sp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BBOX: "-47.684548,-24.348838,-42.775516,-22.197947"
      MAXZOOM: "15"
      MINZOOM: "4"

      R2_ENDPOINT: "https://a5682a7c9f2732888eedbc7c0071c76c.eu.r2.cloudflarestorage.com"
      R2_BUCKET: "maps"
      R2_OBJECT: "sp.pmtiles"

      TILEMAKER_IMAGE: "ghcr.io/systemed/tilemaker:master"

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            awscli \
            jq \
            osmium-tool \
            curl \
            unzip

          aws --version
          osmium --version
          jq --version
          docker --version

      # 3. Download original OSM extract
      - name: Download OSM PBF
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -Eeuo pipefail

          mkdir -p data

          aws s3 cp \
            s3://turin-graph1/sudeste2.osm.pbf \
            data/source.osm.pbf \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors

          test -s data/source.osm.pbf

          ls -lh data/source.osm.pbf

      # 4. Extract the desired geographic area
      - name: Extract São Paulo region
        run: |
          set -Eeuo pipefail

          osmium extract \
            --bbox="$BBOX" \
            --strategy=smart \
            --output=data/sp.osm.pbf \
            data/source.osm.pbf

          test -s data/sp.osm.pbf

          ls -lh data/sp.osm.pbf

      # 5. Download Tilemaker's OpenMapTiles-compatible profile
      - name: Download Tilemaker configuration
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/systemed/tilemaker/master/resources/config-openmaptiles.json \
            -o data/config-original.json

          curl -fsSL \
            https://raw.githubusercontent.com/systemed/tilemaker/master/resources/process-openmaptiles.lua \
            -o data/process.lua

          # Remove layers requiring external shapefile downloads.
          # Keep OSM-derived water, roads, buildings and landcover.

          jq \
            --argjson min "$MINZOOM" \
            --argjson max "$MAXZOOM" \
            '
              del(
                .layers.ocean,
                .layers.urban_areas,
                .layers.ice_shelf,
                .layers.glacier
              )
              | .settings.minzoom = $min
              | .settings.maxzoom = $max
              | .settings.basezoom = $max
              | .layers |= with_entries(
                  .value.maxzoom = $max
                )
            ' \
            data/config-original.json \
            > data/config.json

          jq -e '.layers.transportation and .layers.building and .layers.landcover' \
            data/config.json

          test -s data/process.lua

      # 6. Generate PMTiles
      - name: Generate vector tiles with Tilemaker
        run: |
          set -Eeuo pipefail

          mkdir -p data/tilemaker-store

          docker run \
            --rm \
            --pull always \
            -v "$PWD/data:/data" \
            -w /data \
            "$TILEMAKER_IMAGE" \
            /data/sp.osm.pbf \
            --output /data/sp.pmtiles \
            --config /data/config.json \
            --process /data/process.lua \
            --store /data/tilemaker-store \
            --threads 0 \
            --verbose

          test -s data/sp.pmtiles

          ls -lh data/sp.pmtiles

      # 7. Install PMTiles CLI
      - name: Install PMTiles
        run: |
          set -Eeuo pipefail

          RELEASE=$(curl -fsSL \
            https://api.github.com/repos/protomaps/go-pmtiles/releases/latest)

          URL=$(echo "$RELEASE" | jq -er '
            [.assets[]
              | select(.name | test("Linux_x86_64.*\\.tar\\.gz$"))
              | .browser_download_url
            ][0]
          ')

          curl -fL "$URL" -o pmtiles.tar.gz

          tar -xzf pmtiles.tar.gz pmtiles

          sudo install pmtiles /usr/local/bin/pmtiles

          pmtiles version

      # 8. Validate archive
      - name: Validate PMTiles
        run: |
          set -Eeuo pipefail

          test -s data/sp.pmtiles

          pmtiles verify data/sp.pmtiles

          pmtiles show data/sp.pmtiles --header-json

          echo "PMTiles archive validated successfully."

      # 9. Upload to Cloudflare R2
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -Eeuo pipefail

          # Single PutObject avoids the multipart completion
          # problem encountered with the previous workflow.

          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key "$R2_OBJECT" \
            --body data/sp.pmtiles \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.pmtiles"

          echo "Successfully uploaded:"
          echo "s3://$R2_BUCKET/$R2_OBJECT"
